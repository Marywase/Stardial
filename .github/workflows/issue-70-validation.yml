name: Issue 70 validation
on:
  push:
    branches: [validation/70-card-states-20261125]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run test -w frontend -- src/components/__tests__/ProjectCard.test.tsx src/components/projects/ProjectsList.test.tsx
      - run: cd frontend && ../node_modules/.bin/eslint src/components/ProjectCard.tsx src/components/__tests__/ProjectCard.test.tsx --max-warnings=0
      - run: npm install --prefix /tmp/card-browser playwright
      - run: /tmp/card-browser/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - run: node .validation/card-checks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-screenshots
          include-hidden-files: true
          path: .validation/*.png
